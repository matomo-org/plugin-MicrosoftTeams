name: Plugins CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-ci.yml@main
    with:
      plugin-name: MicrosoftTeams
      # This plugin's phpstan.yml is a bespoke job rather than a call to the shared
      # workflow, so it keeps running on its own; converting it is separate work.
      skip-phpstan: true
